<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy (defense-in-depth alongside the DOMPurify sanitizer).
      Document-level directives only — frame-ancestors / HSTS / X-Frame-Options are
      response headers (see public/_headers and vercel.json).

      Styles, fonts and scripts are now compiled into the bundle, so the former
      allow-list entries for cdn.tailwindcss.com, cdnjs.cloudflare.com,
      aistudiocdn.com and fonts.googleapis.com are gone — nothing is fetched from
      a third-party origin at runtime. 'unsafe-inline' for styles is still needed
      by the app's inline `style=` attributes, and 'unsafe-eval' by the pdf.js
      worker. localhost:54321 entries are for the local Supabase stack in dev.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 ws://127.0.0.1:54321 http://localhost:54321 ws://localhost:54321; worker-src 'self' blob:; manifest-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>CVBase — The CV builder that gets you shortlisted</title>
    <meta name="description" content="Build an ATS-proof, recruiter-ready CV in minutes. 75+ professional templates, an AI writing assistant, and pixel-perfect PDF export — free to start." />
    <meta property="og:title" content="CVBase — The CV builder that gets you shortlisted" />
    <meta property="og:description" content="Build an ATS-proof, recruiter-ready CV in minutes. 75+ templates, AI writing assistant, pixel-perfect PDF export." />
    <meta property="og:type" content="website" />
    <!-- Kept in sync with the active theme by ThemeProvider. -->
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1713'/%3E%3Ctext x='16' y='21.5' font-family='Georgia,serif' font-size='14' font-weight='600' fill='%23FAF7F2' text-anchor='middle'%3ECV%3C/text%3E%3Ccircle cx='25' cy='25' r='3' fill='%23C8442C'/%3E%3C/svg%3E" />
    <script>
      /**
       * Applies the persisted theme before first paint so a dark-mode user never
       * sees a flash of the light theme. ThemeProvider owns the value after
       * mount; this only replays what it last wrote.
       */
      (function () {
        try {
          var stored = localStorage.getItem('cvbase-theme');
          var mode =
            stored === 'light' || stored === 'dark' || stored === 'system'
              ? stored
              : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          if (localStorage.getItem('cvbase-reduce-motion') === 'true') {
            document.documentElement.setAttribute('data-reduce-motion', 'true');
          }
          var scales = { small: 15, default: 16, large: 18, xlarge: 20 };
          var scale = scales[localStorage.getItem('cvbase-text-scale')];
          if (scale) document.documentElement.style.fontSize = scale + 'px';
        } catch (e) {
          /* storage unavailable — fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body class="font-sans text-dark antialiased selection:bg-primary/20 selection:text-primary-dark">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
