name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blocking as of W7: the strict-mode baseline reached 0 errors, so a
      # type regression now fails CI.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Secret-leak guard (no server secrets in the client bundle)
        run: |
          set -euo pipefail
          # Unambiguous server-only markers that must NEVER reach the browser.
          if grep -rEl 'sk_live|sk_test|rk_live|service_role|whsec_' dist/; then
            echo "::error::Server-secret pattern found in dist/ — aborting."
            exit 1
          fi
          # Google API keys look like AIzaSy<33 chars>. Firebase was removed in
          # W1/W2, so NO Google key (Gemini, Firebase, anything) belongs in the
          # client bundle anymore — any match is a real leak.
          if grep -rhoE 'AIzaSy[0-9A-Za-z_-]{33}' dist/ | head -n1 | grep -q .; then
            echo "::error::A Google API key (likely the Gemini key) leaked into dist/."
            exit 1
          fi
          echo "Secret-leak guard passed."

  edge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Deno tests for the Edge Function shared helpers (sanitize, validate,
      # and the LLM provider-routing module). --allow-env is required because
      # importing _shared/auth.ts/config.ts reads Deno.env at module scope
      # (even when a test only exercises pure logic); the LLM router/provider
      # tests mock fetch directly rather than making real network calls, so
      # --allow-net is not needed.
      - name: Deno test (Edge Function helpers)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/_shared/
      # The admin API and the health probe have no browser-side coverage, so
      # they are typechecked here and the admin's pure modules (route parsing,
      # provider-id validation, key masking, LLM roll-ups) are unit-tested.
      - name: Deno check (admin + health)
        run: deno check --node-modules-dir=none supabase/functions/admin/index.ts supabase/functions/health/index.ts
      - name: Deno test (admin + health)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/admin/ supabase/functions/health/
      # Billing and AI-suggest functions carry pure modules with their own tests
      # (webhook dedupe/ordering/user resolution, checkout shaping, prompts).
      - name: Deno test (billing + ai-suggest)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/stripe-webhook/ supabase/functions/stripe-checkout/ supabase/functions/ai-suggest/
      # Career OS functions (typed action gateway, Coach, interview practice):
      # typechecked, then unit-tested against in-memory fakes with no network.
      - name: Deno check (Career OS functions)
        run: deno check --node-modules-dir=none supabase/functions/career-gateway/index.ts supabase/functions/career-coach/index.ts supabase/functions/ai-interview/index.ts
      - name: Deno test (Career OS functions)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/career-gateway/ supabase/functions/career-coach/ supabase/functions/ai-interview/
      # PRISM pipeline tests drive the real LangGraph with a scripted model.
      # --node-modules-dir=none: resolve npm: specifiers from Deno's own cache
      # (the repo package.json would otherwise switch Deno into byonm mode),
      # matching how the Supabase edge runtime resolves them in production.
      # --allow-env: handler_test.ts imports _shared/auth.ts, which reads
      # SUPABASE_URL at module scope (same reason as the steps above).
      - name: Deno test (PRISM pipeline)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/prism-tailor/
      # Live golden suite: 10 CV/JD pairs + adversarial cases against the real
      # routed model (DeepSeek V4 Pro primary, Kimi K2.6 fallback). Runs only
      # when the DEEPSEEK_API_KEYS secret is configured (skipped on forks);
      # deterministic golden checks always run in the step above.
      - name: PRISM golden suite (live model)
        if: ${{ secrets.DEEPSEEK_API_KEYS != '' }}
        env:
          DEEPSEEK_API_KEYS: ${{ secrets.DEEPSEEK_API_KEYS }}
          KIMI_API_KEYS: ${{ secrets.KIMI_API_KEYS }}
        run: deno run --node-modules-dir=none --allow-env --allow-net supabase/functions/prism-tailor/golden/golden_live.ts
